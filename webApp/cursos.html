<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuro+ | Cursos</title>
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/cursos-etec.css">
</head>

<body>

    <div class="menu-panel">
        <div class="menu-header">menu</div>

        <a href="index.html" class="menu-item">Recomendação semanal</a>
        <a href="testes.html" class="menu-item">Testes</a>
        <a href="mural.html" class="menu-item">Mural</a>
        <a href="cursos.html" class="menu-item" style="font-weight: 700; color: #4e6ee8;">Cursos</a>
        <a href="perfil.html" class="menu-item">Perfil</a>
        <a href="admin-etecs.html" id="menu-admin" class="menu-item" style="display:none;">Painel Admin (ETEC)</a>

        <button id="logout-btn" class="btn-sair">Sair da Conta</button>

        <div class="menu-logo-area">
            <img src="assets/images/logo.png" alt="Futuro+ Logo" class="logo-png-img">
        </div>
    </div>

    <nav class="topnav">
        <div class="nav-left">
            <button type="button" class="hamburger" aria-label="Menu principal">
                <span></span><span></span><span></span>
            </button>
            <div class="search-bar">
                <input type="text" placeholder="Buscar cursos..." aria-label="Buscar cursos">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
            </div>
        </div>
        <div class="nav-center">
            <img src="assets/images/logo.png" alt="Futuro+" class="logo-topo">
        </div>
        <div class="nav-right">
            <div class="bell-icon">
                <a href="notificacoes.html" aria-label="Notificações">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 01-3.46 0" />
                    </svg>
                </a>
            </div>
            <div class="avatar">
                <svg viewBox="0 0 34 34" width="34" height="34">
                    <circle cx="17" cy="17" r="17" fill="#555" />
                    <circle cx="17" cy="13" r="6" fill="#888" />
                    <ellipse cx="17" cy="28" rx="10" ry="7" fill="#888" />
                </svg>
            </div>
        </div>
    </nav>

    <div class="main">
        <div class="cursos-hero">
            <div class="greeting">
                Cursos <span style="color: #4e6ee8;">ETEC</span> 🎓
            </div>
            <div class="cursos-subtitle">
                Explore os cursos técnicos oferecidos pelas unidades ETEC de São Paulo. Em breve, os cursos da FATEC
                entram aqui também.
            </div>
        </div>

        <div class="filtros-cursos">
            <div class="busca-cursos-area">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="busca-cursos" placeholder="Buscar por curso, unidade, cidade ou região...">
            </div>
            <div class="contagem-resultados" id="contagem-resultados"></div>
        </div>

        <div class="grid-unidades" id="grid-unidades">
            <p class="carregando-cursos">Carregando unidades...</p>
        </div>
    </div>

    <script type="module" src="assets/js/dashboard.js"></script>
    <script type="module" src="assets/js/cursos-etec.js"></script>
</body>

</html>
